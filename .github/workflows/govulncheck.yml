name: govulncheck

on:
  push:
    branches:
      - main
      - 'release-*'
    paths-ignore:
      - 'Dockerfile.*'
      - 'examples/**'
      - 'deployment/**'
      - 'scripts/gcb2slack/**'
      - 'monitoring/**'
      - 'docs/**'
      - '**/*.md'
      - '.tekton/**'
  pull_request:
    paths-ignore:
      - 'Dockerfile.*'
      - 'examples/**'
      - 'deployment/**'
      - 'scripts/gcb2slack/**'
      - 'monitoring/**'
      - 'docs/**'
      - '**/*.md'
      - '.tekton/**'

permissions:
  contents: read

jobs:
  govulncheck_job:
    runs-on: ubuntu-latest
    name: Run govulncheck
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4
        with:
          go-version-file: go.mod
          go-package: ./...
