name: govulncheck

on:
  push:
    branches:
      - main
      - 'release-*'
    paths-ignore:
      - 'Dockerfile.*'
      - 'examples/**'
      - 'deployment/**'
      - 'scripts/gcb2slack/**'
      - 'monitoring/**'
      - 'docs/**'
      - '**/*.md'
      - '.tekton/**'
  pull_request:
    paths-ignore:
      - 'Dockerfile.*'
      - 'examples/**'
      - 'deployment/**'
      - 'scripts/gcb2slack/**'
      - 'monitoring/**'
      - 'docs/**'
      - '**/*.md'
      - '.tekton/**'

permissions:
  contents: read

jobs:
  govulncheck_job:
    runs-on: ubuntu-latest
    name: Run govulncheck
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # go-version-input defaults to 'stable' and overrides go-version-file; keep on the go.mod minor version; latest patch is used.
          go-version-input: '1.27'
          go-package: ./...
